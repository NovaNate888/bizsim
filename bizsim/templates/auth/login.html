{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="card-title mb-4 text-center fw-bold">
          <i class="bi bi-graph-up-arrow text-primary me-2"></i>Sign In
        </h2>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="email" class="form-label">School Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="you@university.edu" required autofocus />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember" name="remember" />
            <label class="form-check-label" for="remember">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </button>
        </form>

        <hr />
        <div class="d-flex justify-content-between small">
          <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
          <a href="{{ url_for('auth.register') }}">Create account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
