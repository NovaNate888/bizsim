{% extends "base.html" %}
{% block title %}Semesters{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">Semesters</h2>
</div>

<div class="row g-4">
  <!-- Create form -->
  <div class="col-md-4">
    <div class="card shadow-sm border-0">
      <div class="card-header"><h6 class="mb-0">Add Semester</h6></div>
      <div class="card-body">
        <form method="POST">
          <input type="hidden" name="action" value="create" />
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name"
                   placeholder="e.g. Fall 2025" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-plus-circle me-1"></i>Create
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Semesters list -->
  <div class="col-md-8">
    <div class="card shadow-sm border-0">
      <div class="card-header"><h6 class="mb-0">All Semesters</h6></div>
      <div class="list-group list-group-flush">
        {% for sem in semesters %}
          <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <span class="fw-semibold">{{ sem.name }}</span>
              {% if sem.is_active %}
                <span class="badge bg-success ms-2">Active</span>
              {% else %}
                <span class="badge bg-secondary ms-2">Inactive</span>
              {% endif %}
            </div>
            <form method="POST" class="d-inline">
              <input type="hidden" name="action" value="toggle" />
              <input type="hidden" name="semester_id" value="{{ sem.id }}" />
              <button type="submit" class="btn btn-sm {% if sem.is_active %}btn-outline-danger{% else %}btn-outline-success{% endif %}">
                {% if sem.is_active %}Deactivate{% else %}Activate{% endif %}
              </button>
            </form>
          </div>
        {% else %}
          <div class="list-group-item text-muted">No semesters yet.</div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
